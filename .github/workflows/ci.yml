name: CI

# 四道门禁（AGENTS.md §9.3）：lint / typecheck / test / build
# 外加密钥泄漏检查（§8「不硬编码密钥」）
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI 中不连接真实外部服务：集成测试会因缺少 DATABASE_URL 而显式跳过，
  # 绝不用假断言伪装通过（AGENTS.md §9.4）。
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: 验证（lint / typecheck / test / build）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 密钥泄漏检查
        run: node scripts/check-secrets.mjs

      - name: 公开信息审计
        # 检查不该出现在公开仓库里的内容：真实邮箱、内网地址、
        # 本机绝对路径（会暴露 Windows 用户名）、被赋值的密钥变量
        run: node scripts/audit-public.mjs

      - name: Lint
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        # 集成测试需要 DATABASE_URL；CI 未提供时会在报告中标注为跳过
        run: pnpm test

      - name: 生产构建
        run: pnpm build

      - name: 提示集成测试状态
        run: |
          echo "::notice title=集成测试::未配置 DATABASE_URL，tests/integration/* 已显式跳过。"
          echo "如需在 CI 覆盖集成测试，请配置 secrets.DATABASE_URL 与 secrets.AUTH_SECRET。"

  # 可选：配置了数据库凭证时才跑集成测试
  integration:
    name: 集成测试（需 DATABASE_URL）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 执行数据库迁移
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

      - name: 运行全部测试（含集成）
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
        run: pnpm test
